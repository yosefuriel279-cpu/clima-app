<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App del Clima - API</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
</head>
<body>
    <header>
        <button type="button" id="btnTema" class="btn-tema">🌙</button>

        <img src="cristiano.jpg" alt="Banner de la App del Clima" class="banner">
        <h1>⛅ App del Clima</h1>
        <p>Consulta el clima en tiempo real de cualquier ciudad</p>
    </header>

    <main>
        <form id="formulario" class="buscador">
            <input type="text" id="inputCiudad" placeholder="Escribe una ciudad..." required>
            <button type="submit">🔍 Consultar</button>
        </form>
        <button type="button" id="btnUbicacion" class="btn-ubicacion">
            📍 Usar mi ubicación
        </button>

        <p id="estado">Escribe una ciudad y presiona "Consultar".</p>

        <div id="resultado" class="resultado"></div>

        <div id="pronostico" class="pronostico"></div>
        <div id="historial" class="historial"></div>
    </main>

    <footer>
        <p>Práctica 2 - Consumo de API de Clima | HTML5, CSS3, JavaScript y JSON</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
